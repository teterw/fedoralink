name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Android Gradle Plugin 8.7 does not support JDK 22+.
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK after the tag
        id: rename
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          DEST="fedoralink-${VERSION}.apk"
          cp "$SRC" "$DEST"
          echo "apk=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedoralink-apk
          path: ${{ steps.rename.outputs.apk }}

      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename.outputs.apk }}
          generate_release_notes: true
          body: |
            ## Install

            **Fedora (PC):**
            ```
            curl -fsSL https://raw.githubusercontent.com/teterw/fedoralink/main/install.sh | bash
            ```

            **Android (phone):** download the `.apk` below and sideload it.

            The APK is debug-signed, so Android will warn about an unknown
            source. That is expected for a sideloaded build.
