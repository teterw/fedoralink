name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  daemon:
    name: Daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyGObject
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi libgirepository1.0-dev gir1.2-glib-2.0

      - name: Byte-compile
        working-directory: daemon
        run: python -m compileall -q fedoralink tests

      - name: Lint
        run: |
          python -m pip install ruff
          # daemon/, not daemon/fedoralink: the narrower path skipped the
          # tests, so a commit whose test files failed ruff went green.
          ruff check daemon/

      - name: Test
        run: |
          # cryptography provides AES-GCM for the LAN transport; the stdlib
          # has no cipher API. Prebuilt wheels, so this is quick.
          python -m pip install pytest cryptography
          python -m pytest -q

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Assemble
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Unit tests
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon
